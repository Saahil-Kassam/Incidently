<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidently</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/hub.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Incident<span>ly</span></a>
    <nav class="nav" aria-label="Main">
      <a href="/" aria-current="page">Incidents</a>
      <a href="/progress">Progress</a>
    </nav>
    <span class="spacer"></span>
    <span class="mode-tag"></span>
    <button id="theme-toggle" class="theme-toggle" type="button">Theme</button>
  </header>
  <main class="page">
    <h1>Pick an incident</h1>
    <p class="lead">
      Each incident starts with a service-desk ticket and a terminal on the affected network.
      Investigate with real commands, fix the root cause, then submit to be graded.
    </p>
    <div class="toolbar" role="search">
      <label class="search">
        <span class="visually-hidden">Search incidents</span>
        <span class="icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search by name, topic, or skill" autocomplete="off" data-search>
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="filters" id="filters"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>
    <div id="scenarios" class="grid" aria-live="polite"><p class="muted">Loading incidents…</p></div>
  </main>
  <div id="overlay" class="overlay" hidden></div>
</body>
</html>
