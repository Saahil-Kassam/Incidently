[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidently"
version = "0.2.0"
description = "A local hub for practising enterprise networking incident response."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added by the milestone that first needs them.
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",  # pure-Python wheel: installs on every Python/OS, unlike PyYAML
    "uvicorn>=0.30",  # plain, not [standard]: its extras lack wheels on new Pythons
]

[project.scripts]
incidently = "incidently.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incidently = ["scenarios/*.yaml"]
"incidently.web" = ["static/*", "static/vendor/xterm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
